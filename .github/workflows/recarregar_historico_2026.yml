name: Recarregar histórico PIX 2026

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recarregar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Recarregar histórico de 2026
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python recarregar_historico_2026.py

      - name: Commit dos arquivos atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git rm -r --cached __pycache__ || true
          rm -rf __pycache__

          echo "__pycache__/" >> .gitignore
          echo "*.pyc" >> .gitignore

          git add .gitignore
          git add data/*.json data/*.html index.html || true

          if git diff --cached --quiet; then
            echo "Sem alterações para commitar"
            exit 0
          fi

          git commit -m "Recarrega histórico PIX 2026"

          git pull --rebase origin main || {
            echo "Conflito no rebase. Mantendo os arquivos gerados agora pelo robô."
            git rebase --abort || true
            git pull origin main --no-rebase -X ours
          }

          git push origin main
